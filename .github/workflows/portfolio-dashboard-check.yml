name: Portfolio guide checks
on:
  pull_request:
    paths: ['docs/portfolio/**', 'assets/portfolio/**', 'scripts/portfolio/**', '.github/workflows/portfolio-dashboard-check.yml']
  push:
    branches: [main]
    tags: ['**']
    paths: ['docs/portfolio/**', 'assets/portfolio/**', 'scripts/portfolio/**', '.github/workflows/portfolio-dashboard-check.yml']
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Audit runner network activity
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Validate guide data, source paths and SVG
        run: python3 scripts/portfolio/validate_guide.py
