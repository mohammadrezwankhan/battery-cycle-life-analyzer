[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bcla"
version = "0.1.0"
description = "Battery Cycle‑Life Analyzer — fit degradation models, project EOL"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = [
    "numpy>=1.21",
    "scipy>=1.7",
    "matplotlib>=3.5",
]
authors = [
    { name = "Mohammad Rezwan Khan", email = "mohammadrezwankhan@users.noreply.github.com" },
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering",
]

[project.urls]
Home = "https://github.com/mohammadrezwankhan/battery-cycle-life-analyzer"

[project.optional-dependencies]
dev = ["pytest"]
