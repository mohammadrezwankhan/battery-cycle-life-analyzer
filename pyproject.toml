[build-system]
requires = ["setuptools>=77.0.3", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "battery-cycle-life-analyzer"
version = "0.1.0"
description = "Fit battery capacity-fade models and project bounded end of life"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    "numpy>=1.21",
    "scipy>=1.7",
    "matplotlib>=3.5",
]
authors = [
    { name = "Mohammad Rezwan Khan", email = "mohammadrezwankhan@users.noreply.github.com" },
]
keywords = [
    "battery",
    "battery-degradation",
    "cycle-life",
    "remaining-useful-life",
    "curve-fitting",
    "energy-storage",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering",
]

[project.urls]
Homepage = "https://mohammadrezwankhan.github.io/battery-cycle-life-analyzer/"
Source = "https://github.com/mohammadrezwankhan/battery-cycle-life-analyzer"
Issues = "https://github.com/mohammadrezwankhan/battery-cycle-life-analyzer/issues"
Documentation = "https://github.com/mohammadrezwankhan/battery-cycle-life-analyzer#readme"
Changelog = "https://github.com/mohammadrezwankhan/battery-cycle-life-analyzer/blob/main/CHANGELOG.md"

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
bcla = "bcla.__main__:main"

[tool.setuptools.packages.find]
include = ["bcla*"]
