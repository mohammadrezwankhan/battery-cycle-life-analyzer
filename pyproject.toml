[build-system]
requires = ["setuptools>=77.0.3", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "battery-cycle-life-analyzer"
version = "0.3.0"
description = "Fit battery capacity-fade models and project bounded end of life"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    "numpy>=1.21",
    "scipy>=1.7",
    "matplotlib>=3.5",
]
authors = [
    { name = "Mohammad Rezwan Khan", email = "mohammadrezwankhan@users.noreply.github.com" },
]
keywords = [
    "battery",
    "battery-degradation",
    "cycle-life",
    "remaining-useful-life",
    "curve-fitting",
    "energy-storage",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering",
]

[project.urls]
Homepage = "https://mohammadrezwankhan.github.io/battery-cycle-life-analyzer/"
Source = "https://github.com/mohammadrezwankhan/battery-cycle-life-analyzer"
Issues = "https://github.com/mohammadrezwankhan/battery-cycle-life-analyzer/issues"
Documentation = "https://github.com/mohammadrezwankhan/battery-cycle-life-analyzer#readme"
Changelog = "https://github.com/mohammadrezwankhan/battery-cycle-life-analyzer/blob/main/CHANGELOG.md"

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
bcla = "bcla.__main__:main"

[tool.setuptools.packages.find]
include = ["bcla*"]

[dependency-groups]
dev = ["ruff==0.17.3", "mypy==2.4.1", "pytest==9.2.0", "pytest-cov==7.1.0", "hypothesis==6.170.14", "scipy-stubs==1.17.0.2"]

[tool.ruff]
target-version = "py39"
line-length = 100

[tool.ruff.per-file-target-version]
# Isolated CI scanners execute on Python 3.12; application support stays unchanged.
".github/security/*.py" = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "S", "A", "C4", "DTZ", "T20", "SIM", "RET", "ARG", "PTH", "PERF", "RUF"]
# These Greek parameter names are part of the public fitted-model API.
allowed-confusables = ["α", "β"]

[tool.ruff.lint.pyupgrade]
# Runtime annotation inspection must continue to work on supported Python 3.9.
keep-runtime-typing = true

[tool.mypy]
strict = true
files = ["bcla", "tests", "scripts"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff.lint.per-file-ignores]
# Pytest rewrites assertions into rich test failures; these are not production guards.
"tests/test_*.py" = ["S101"]
