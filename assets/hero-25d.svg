      .float{animation:h-battery-cycle-life-analyzer-float 5s ease-in-out infinite}
      .signal{animation:h-battery-cycle-life-analyzer-signal 2.6s ease-in-out infinite}
      @keyframes h-battery-cycle-life-analyzer-flow{to{stroke-dashoffset:-34}}
      @keyframes h-battery-cycle-life-analyzer-float{50%{transform:translateY(-6px)}}
      @keyframes h-battery-cycle-life-analyzer-signal{50%{opacity:.35}}
      @media(prefers-reduced-motion:reduce){.flow,.float,.signal{animation:none!important}}
    </style>
